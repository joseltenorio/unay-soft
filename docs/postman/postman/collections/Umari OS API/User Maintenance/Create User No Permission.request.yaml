$kind: http-request
url: http://localhost:3000/api/users
method: POST
body:
  type: json
  content: "{\r

    \  \"nombres\": \"{{CREATE_USER_NOMBRES}}\",\r

    \  \"apellidos\": \"{{CREATE_USER_APELLIDOS}}\",\r

    \  \"email\": \"{{CREATE_USER_EMAIL}}\",\r

    \  \"username\": \"{{CREATE_USER_USERNAME}}\",\r

    \  \"celular\": \"{{CREATE_USER_CELULAR}}\",\r

    \  \"id_rol\": \"{{CREATE_USER_ROLE_ID}}\",\r

    \  \"estado\": \"{{CREATE_USER_STATUS}}\"\r

    }"
auth:
  type: bearer
  credentials:
    token: "{{AUTH_TOKEN}}"
order: 5000
