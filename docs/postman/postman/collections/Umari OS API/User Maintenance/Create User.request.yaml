$kind: http-request
url: http://localhost:3000/api/users
method: POST
body:
  type: json
  content: "{\r

    \  \"nombres\": \"{{UMARI_USER_NAME}}\",\r

    \  \"apellidos\": \"{{UMARI_USER_LAST_NAME}}\",\r

    \  \"email\": \"{{UMARI_USER_EMAIL}}\",\r

    \  \"username\": \"{{UMARI_USER_IDENTIFIER}}\",\r

    \  \"password\": \"{{UMARI_USER_PASSWORD}}\",\r

    \  \"celular\": \"{{UMARI_USER_MOBILE}}\",\r

    \  \"id_rol\": \"{{UMARI_ROL}}\",\r

    \  \"estado\": \"{{UMARI_STATUS}}\"\r

    }"
auth:
  type: bearer
  credentials:
    token: "{{AUTH_TOKEN}}"
order: 2000
